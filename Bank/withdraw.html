<!DOCTYPE html>
<html>
<head>
    <title>Withdraw Money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Withdraw</h1>
<nav>
    <a href="accounts.html">Accounts</a>
    <a href="create.html">Create Account</a>
    <a href="deposit.html">Deposit</a>
</nav>

<form id="withdrawForm">
    Account ID: <input type="number" id="withdrawId" required>
    Amount: <input type="number" id="withdrawAmount" required>
    <button type="submit">Withdraw</button>
</form>

<script src="script.js"></script>
<script>
document.getElementById("withdrawForm").addEventListener("submit", function(e){
    e.preventDefault();
    if (withdraw(parseInt(document.getElementById("withdrawId").value), parseFloat(document.getElementById("withdrawAmount").value))){
        alert("Withdraw successful!");
    } else {
        alert("Insufficient funds or account not found!");
    }
    this.reset();
});
</script>
</body>
</html>
